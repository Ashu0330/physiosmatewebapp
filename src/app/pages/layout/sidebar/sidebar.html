<!-- Role-Specific Sidebar Navigation -->
@if (userRole === 'doctor') {
<!-- ── Doctor Sidebar ── -->
<aside class="physios-sidebar">
  <nav class="physios-nav">

    <button type="button" class="physios-nav-btn" [class.active]="activeTab === 'dashboard'"
      (click)="selectTab('dashboard')">
      <svg class="sidebar-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      Dashboard
    </button>

    <button type="button" class="physios-nav-btn" [class.active]="activeTab === 'add-patient'"
      (click)="selectTab('add-patient')">
      <svg class="sidebar-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7" r="4"></circle>
        <line x1="20" y1="8" x2="20" y2="14"></line>
        <line x1="23" y1="11" x2="17" y2="11"></line>
      </svg>
      Add Patient
    </button>

    <button type="button" class="physios-nav-btn" [class.active]="activeTab === 'Consultations'"
      (click)="selectTab('Consultations')">
      <svg class="sidebar-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <path d="M9 13h6"></path>
        <path d="M12 10v6"></path>
      </svg>
      Consultations
    </button>

    <button type="button" class="physios-nav-btn" [class.active]="activeTab === 'Appointments'"
      (click)="selectTab('Appointments')">
      <svg class="sidebar-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      Appointments
    </button>

    <button type="button" class="physios-nav-btn" [class.active]="activeTab === 'patients'"
      (click)="selectTab('patients')">
      <svg class="sidebar-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      Patients
    </button>

    <button type="button" class="physios-nav-btn" [class.active]="activeTab === 'treatment-plans'"
      (click)="selectTab('treatment-plans')">
      <svg class="sidebar-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      Treatment Plans
    </button>

  </nav>
</aside>
}

@if (userRole === 'patient') {
<!-- ── Patient Sidebar ── -->
<aside class="physios-sidebar">
  <nav class="physios-nav">

    <button type="button" class="physios-nav-btn" [class.active]="activeTab === 'medical-reports'"
      (click)="selectTab('medical-reports')">
      Medical Records
    </button>

    <button type="button" class="physios-nav-btn" [class.active]="activeTab === 'appointments'"
      (click)="selectTab('appointments')">
      Appointments
    </button>

    <button type="button" class="physios-nav-btn" [class.active]="activeTab === 'subscriptions'"
      (click)="selectTab('subscriptions')">
      Subscriptions
    </button>

    <button type="button" class="physios-nav-btn" [class.active]="activeTab === 'payments'"
      (click)="selectTab('payments')">
      Payments
    </button>

    <button type="button" class="physios-nav-btn" [class.active]="activeTab === 'consultancies'"
      (click)="selectTab('consultancies')">
      Consultations
    </button>

  </nav>
</aside>
}
