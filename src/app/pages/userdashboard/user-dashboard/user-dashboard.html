<div class="physios-drive-page">
  <div class="physios-drive-box">

    <!-- Top Header Row -->
    <div class="physios-drive-topbar">
      <div class="topbar-left"></div>
      <div class="topbar-right">
        <div class="user-profile-header">
          <div class="user-avatar-box">
            @if (currentUser?.profilePictureUrl) {
            <img [src]="currentUser.profilePictureUrl" [alt]="currentUser?.fullName" class="user-avatar-img" />
            } @else {
            <svg class="user-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="#B0B0B0">
              <path
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
            }
          </div>
          <div class="user-details">
            <span class="user-name">{{ currentUser?.fullName || 'Himanshu Suman' }}</span>
            <span class="user-phone">{{ currentUser?.mobile || currentUser?.email || '+919571670547' }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
